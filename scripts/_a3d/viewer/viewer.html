<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>3D Assistent</title>
  <link rel="stylesheet" href="css/viewer.css" />
</head>
<body>
<!-- Bühne: Raum + Smartboard (liegt HINTER der 3D-Figur) -->
<img id="stage-narrow-bg" alt="">   <!-- eigenes Bild für das schmale Layout (STAGE.narrow.background) -->
<div id="stage">
  <img id="stage-bg" alt="">        <!-- eigenes Hintergrundbild (STAGE.background) statt des Raums -->
  <div id="room"></div>             <!-- gezeichneter Raum (room.js) -->
  <canvas id="chalk"></canvas>      <!-- Tafel hinter dem Board: mit der Maus malen -->
  <div id="room-shade"></div>       <!-- Abend/Nacht: Raum abdunkeln (das Board leuchtet selbst) -->
  <div id="board-unit">             <!-- rollbares Board: Rahmen, Bildfläche, Ständer -->
    <div class="deco board-stand"><i class="leg l"><b class="wheel"></b><b class="wheel"></b></i><i class="leg r"><b class="wheel"></b><b class="wheel"></b></i></div>
    <div class="deco board-case"></div>
    <div id="board"><iframe id="board-frame" title="Board"></iframe></div>
    <div class="deco" id="board-grip" title="Board zur Seite schieben (klicken oder ziehen)"></div>
  </div>
</div>

<div id="hint">Lade 3D-Modell…</div>
<button id="panel-toggle" title="Steuerung einblenden">☰</button>
<div id="anim-panel">
  <h4>💡 Helligkeit</h4>
  <input type="range" id="brightness" min="0.2" max="2.5" step="0.05" value="1" style="width:100%; margin-bottom:1vh;">
  <h4 id="anim-heading">🎬 Animationen</h4>
</div>
<div id="chat-container">
  <div id="chat-messages"></div>
  <div id="chat-row">
    <button id="chat-expand" title="Chat aufklappen (ganzer Verlauf)">▲</button>   <!-- stage.js -->
    <input type="text" id="chat-input" placeholder="Schreibe hier..." />
    <button id="chat-think" title="Nachdenken" style="display:none">💭</button>  <!-- assistant.js -->
    <button id="chat-mic" title="Sprechen" style="display:none">🎤</button>      <!-- assistant.js -->
  </div>
</div>

<!-- Bibliotheken: three.js r147, lokal mitgeliefert (läuft ohne Internet) -->
<script src="js/token.js"></script>         <!-- Token für den Asset-Server (vor allen anderen) -->
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/OutlineEffect.js"></script>

<!-- Eigene Skripte - Reihenfolge ist wichtig (spätere nutzen frühere) -->
<script src="js/toon-shader.js"></script>  <!-- Shader, Materialien, Licht -->
<script src="js/core.js"></script>         <!-- Szene-Variablen, Chat -->
<script src="js/pose.js"></script>         <!-- Rig + Helfer (dir(), aim(), rotate()) -->
<script src="js/motion.js"></script>       <!-- Easing, Keyframes, Feder-Glättung -->
<script src="js/hands.js"></script>        <!-- Fingerposen, Handflächen drehen -->
<script src="js/idle.js"></script>         <!-- natürliches Idle (braucht dir() aus pose.js) -->
<script src="js/gestures.js"></script>     <!-- Gesten / Moderation -->
<script src="js/pet.js"></script>          <!-- Streicheln am Kopf -->
<script src="js/walk.js"></script>         <!-- Laufen auf der Stelle -->
<script src="js/clips.js"></script>        <!-- Blender-Animationen: Kategorien, Abspielen -->
<script src="js/stations.js"></script>     <!-- Stationen: Punkte, zu denen die Figur läuft -->
<script src="js/physics.js"></script>      <!-- Haar-/Rock-Physik -->
<script src="js/face.js"></script>         <!-- Lippensync, Blinzeln -->
<script src="js/voice.js"></script>        <!-- Stimme: lokaler TTS, Lautstärke -->
<script src="js/expressions.js"></script>  <!-- Mimik: Ausdrücke aus Shape Keys -->
<script src="js/actions.js"></script>      <!-- [Aktionen] im Chat ausführen -->
<script src="js/assistant.js"></script>    <!-- KI-Assistent (Ollama/MCP), Spracheingabe -->
<script src="js/panel.js"></script>        <!-- Bedienpanel -->
<script src="js/stage.js"></script>        <!-- Bühne, Board, Kamera-Ausschnitt, Mausblick -->
<script src="js/room.js"></script>         <!-- Raum: Fenster, Uhr, Licht, Tafel, rollbares Board -->
<script src="js/room3d.js"></script>       <!-- 3D-Raum aus models/room.glb (falls vorhanden): Himmel, Wasser -->
<script src="js/main.js"></script>         <!-- Setup, Laden, Render-Schleife (startet alles) -->
</body>
</html>
